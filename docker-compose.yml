version: '3.8'

services:
  # ==================================================
  # 1. MongoDB Database Service
  # ==================================================
  mongo:
    image: mongo:7.0
    container_name: eduenlighten-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: eduenlighten
    volumes:
      - mongo-data:/data/db
    networks:
      - eduenlighten-net

  # ==================================================
  # 2. Backend REST API (Node.js / Express)
  # ==================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eduenlighten-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/eduenlighten
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=eduenlighten_production_jwt_secret_key_32_characters_minimum!
      - JWT_EXPIRES_IN=7d
      - COOKIE_NAME=eduenlighten_token
      - EMAIL_SERVICE=console
      - LIVE_CLASS_PROVIDER=jitsi
      - PAYMENT_PROVIDER=mock_paynow
    depends_on:
      - mongo
    networks:
      - eduenlighten-net

  # ==================================================
  # 3. Frontend Web App (Next.js 16)
  # ==================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eduenlighten-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_URL=http://backend:5001
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    depends_on:
      - backend
    networks:
      - eduenlighten-net

volumes:
  mongo-data:
    driver: local

networks:
  eduenlighten-net:
    driver: bridge
