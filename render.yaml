services:
  # ==================================================
  # 1. Backend REST API (Express + TypeScript)
  # ==================================================
  - type: web
    name: eduenlighten-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false

  # ==================================================
  # 2. Frontend Web App (Next.js 16)
  # ==================================================
  - type: web
    name: eduenlighten-web
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: eduenlighten-api
          property: host
